name = "coachingos"
main = "server/worker.js"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "coachingos-db"
database_id = "coachingos-local-d1"

# Optional R2 bucket for homework attachments and exports
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "coachingos-attachments"
