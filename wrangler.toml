name = "coachingos"
main = "server/worker.js"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
not_found_handling = "single-page-application"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "coachingos-db"
database_id = "42084919-c64e-4ddf-bf14-56cd9e2b5906"

